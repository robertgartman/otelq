# Early-warning probe: verifies the pinned DuckDB still has a published
# 'otlp' community extension build (the #1 fragility — see context/adr/ADR-003).
#
# The build is published per DuckDB version AND per platform, so each platform
# is its own leg, and each leg asserts the state we believe it to be in:
#
#   expect: available   — ubuntu/macos. Red means the pinned DuckDB version has
#       lost its matching duckdb-otlp build. See ADR-003 before bumping.
#   expect: unavailable — windows. The community repository publishes no
#       windows_amd64 build of otlp 0.6.x at all, so `uvx otelq` installs cleanly
#       there and then fails at the first INSTALL unless a binary is supplied.
#       This leg is GREEN while that is still true and RED on the day a signed
#       build appears — that red is the good news. Upstream restored MSVC builds
#       in smithclay/duckdb-otlp#67 (otlp 0.7.x, DuckDB v1.5.5) and the pin is
#       already on v1.5.5, so nothing is left but for that to land in
#       duckdb/community-extensions. Until then Windows runs on upstream's own
#       unsigned binary, loaded by file — see the test-windows job in ci.yml.
#
# Either way a red leg means the platform's state changed and someone has to
# look — which is the whole point of probing weekly rather than finding out
# from a user.

name: Extension Probe

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  probe:
    name: otlp probe (${{ matrix.os }}, expect ${{ matrix.expect }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expect: available
          - os: macos-latest
            expect: available
          - os: windows-latest
            expect: unavailable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Probe otlp community extension for duckdb 1.5.5
        shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          uv run --with "duckdb==1.5.5" python - <<'PY'
          import os
          import sys

          import duckdb

          expect = os.environ.get("EXPECT", "available")
          platform = duckdb.connect().execute("PRAGMA platform").fetchone()[0]
          label = f"{platform} / duckdb {duckdb.__version__}"

          try:
              conn = duckdb.connect()
              conn.execute("INSTALL otlp FROM community")
              conn.execute("LOAD otlp")
          except duckdb.Error as exc:
              if expect == "unavailable":
                  print(f"expected: still no published otlp build for {label}")
                  print(f"  {exc}")
                  sys.exit(0)
              print(f"REGRESSION: otlp no longer installs or loads on {label}", file=sys.stderr)
              print(f"  {exc}", file=sys.stderr)
              print("  Read context/adr/ADR-003 before touching the pin.", file=sys.stderr)
              sys.exit(1)

          if expect == "unavailable":
              print(f"otlp now LOADS on {label} — the platform gap has closed.", file=sys.stderr)
              print("  This is the signal, not a failure. Next steps:", file=sys.stderr)
              print("   1. No pin bump is needed — confirm `uvx otelq summary` answers", file=sys.stderr)
              print("      on this platform with no OTELQ_* variable set.", file=sys.stderr)
              print("   2. Flip this leg to `expect: available`.", file=sys.stderr)
              print("   3. Fold the platform into ci.yml's test matrix and drop the", file=sys.stderr)
              print("      supplied-binary job (test-windows).", file=sys.stderr)
              print("   4. Drop the platform caveat from the otelq.py header comment,", file=sys.stderr)
              print("      _connect_with_otlp's docstring and the README; record it", file=sys.stderr)
              print("      in ADR-003.", file=sys.stderr)
              sys.exit(1)

          print(f"otlp extension OK for {label}")
          PY
